services:
  krampus:
    build:
        context: ./
    restart: on-failure
    container_name: krampus
    environment:
      - PYTHONUNBUFFERED=1
  mysql:
    image: mysql:8.4
    restart: on-failure
    container_name: krampus_db
    environment:
      MYSQL_DATABASE: krampus
      MYSQL_USER: krampus_rw
      MYSQL_PASSWORD: Krampus01!
      MYSQL_RANDOM_ROOT_PASSWORD: "true"
    # logging:
    #   driver: none
    # volumes:
    #   - mysql-krampus:/var/lib/mysql
  phpmyadmin:
    image: phpmyadmin
    restart: on-failure
    ports: 
      - 8094:80
    environment:
      - PMA_HOST=mysql
      # - PMA_VERBOSE=horsebot_prod
    logging:
      driver: none